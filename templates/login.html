<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Student Portal</title>
</head>
<body>
    <div>
        <h1>IT Student Portal</h1>
        <p>Access your collaborative workspace</p>
    </div>

    <div>
        <div>
            <a href="#">Login</a>
            <a href="#">Register</a>
        </div>

        <div id="loginForm">
            
            <div>
                <label for="loginEmail">Email Address</label>
                <input 
                    type="email" 
                    id="loginEmail" 
                    placeholder="student@university.edu"
                >
            </div>

            <div>
                <label for="loginPassword">Password</label>
                <input 
                    type="password" 
                    id="loginPassword" 
                    placeholder="••••••••"
                >
            </div>

            <button>Access Portal</button>
        </div>

</body>
</html>
