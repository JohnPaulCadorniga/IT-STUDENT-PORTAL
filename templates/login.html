<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/login.css">
    <title>IT Student Portal</title>
</head>
<body>
    <div class="header">
        <h1>IT Student Portal</h1>
        <p>Access your collaborative workspace</p>
    </div>

    <div class="container">
        <div>
            <a href="#">Login</a>
            <a href="#">Register</a>
        </div>

        <div id="loginForm">
            <div>
                <label for="loginEmail">Email Address</label>
                <input 
                    type="email" 
                    id="loginEmail" 
                    placeholder="student@university.edu"
                >
            </div>

            <div>
                <label for="loginPassword">Password</label>
                <input 
                    type="password" 
                    id="loginPassword" 
                    placeholder="••••••••"
                >
            </div>

            <button id="btn-access">Access Portal</button>
        </div>

</body>
</html>
