<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Student Portal - Register</title>
    <link rel="stylesheet" href="../static\css/register.css"> 

</head>
<body>
    <div class="container">
        <div class="form-box" id="register-box">
            <h2>Student Registration</h2>
            <p>Create your IT Student Portal account</p>
            
            <form>

                 <div class = "tab-header">
                    <a href="{{url_for('login')}}">Login</a>
                    <a href="{{url_for('register')}}" class = "current-page">Register</a>
                 </div>
                 
                <div class="form-group">
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" name="firstname" placeholder="Enter your first name" required>
                </div>

                <div class="form-group">
                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" name="lastname" placeholder="Enter your last name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="studentid">Student ID:</label>
                    <input type="text" id="studentid" name="studentid" placeholder="Enter your Student ID" required>
                </div>

                 <div class="form-group">
                    <label for="birthdate">Date of Birth:</label>
                    <input type="date" id="birthdate" name="birthdate" required>
                </div>


                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="form-group">
                    <label for="confirmpassword">Confirm Password:</label>
                    <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm your password" required>
                </div>

                 <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the Terms and Conditions</label>
                </div>
            </form>
                <a href = "{{url_for('login')}}"><button class="btn">Register Account</button></a>
        </div>
    </div>
</body>
</html>
